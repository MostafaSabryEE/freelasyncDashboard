<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelaSync | Freelancer Management System - Mostafa Sabry</title>
    <style>
        /*
         * CORE PRINCIPLES: Global Styles & Theming
         */
        :root {
            --primary: #1a1b1e;
            --secondary: #2c2e33;
            --accent: #228be6;
            --accent-hover: #1c7ed6;
            --text-main: #c1c2c5;
            --text-muted: #909296;
            --border: #373a40;
            --success: #12b886;
            --warning: #fab005;
            --logo-primary: #a5d8ff;
            --logo-secondary: #e7f5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--primary); color: var(--text-main); font-size: 14px; display: flex; flex-direction: column; min-height: 100vh; padding: 20px; }

        button { cursor: pointer; border: none; border-radius: 4px; padding: 6px 12px; font-weight: 500; transition: background 0.2s, color 0.2s; }
        button:hover { opacity: 0.9; }

        /*
         * HEADER SECTION
         */
        header { display: flex; align-items: center; justify-content: space-between; padding: 0 0 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; gap: 20px;}

        /* Unified Logo */
        .brand-container { display: flex; align-items: center; gap: 12px; min-width: 0;}
        .app-logo { width: 100px; height: 100px;}
        .app-title-group { display: flex; flex-direction: column;}
        .app-name { font-size: 1.2rem; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1px; color: var(--logo-secondary);}
        .creator-tag { font-size: 0.75rem; color: var(--text-muted); font-weight: normal; margin-top: -3px; color: var(--logo-primary);}

        .global-actions { display: flex; gap: 10px; flex-shrink: 0;}
        .btn-header { background: var(--secondary); color: var(--text-main); border: 1px solid var(--border); }
        .btn-header:hover { background: var(--accent); color: white; border-color: transparent;}
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-danger { background: rgba(250, 82, 82, 0.1); color: #fa5252; border: 1px solid rgba(250, 82, 82, 0.2);}
        .btn-danger:hover { background: #fa5252; color: white; }

        /*
         * LAYOUT & GENERAL UI
         */
        main { flex-grow: 1; display: grid; grid-template-columns: minmax(320px, 1fr) 3fr; gap: 20px; }
        @media (max-width: 992px) { main { grid-template-columns: 1fr; } }

        .form-section, .dashboard-section { display: flex; flex-direction: column; gap: 20px; }

        /* Panel Common */
        .panel { background-color: var(--secondary); border: 1px solid var(--border); border-radius: 6px; padding: 16px; display: flex; flex-direction: column;}
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-size: 0.95rem; font-weight: 600; color: #fff; }

        /* Forms */
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;}
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;}
        label { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { background-color: rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.05); color: #f8f9fa; border-radius: 4px; padding: 8px 10px; font-size: 0.9rem;}
        input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: transparent;}
        select { appearance: none;}

        /*
         * DASHBOARD ELEMENTS
         */
        /* Summary Stats */
        .summary-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;}
        @media (max-width: 600px) { .summary-stats { grid-template-columns: 1fr 1fr;} }
        .stat-card { background: rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 4px;}
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .stat-value.currency { color: var(--success); }

        /* Project Cards Container */
        .project-list { display: flex; flex-direction: column; gap: 16px; margin-top: 10px;}
        .empty-state { text-align: center; color: var(--text-muted); padding: 30px 0; border: 2px dashed var(--border); border-radius: 6px;}

        /* Individual Project Card */
        .proj-card { border-radius: 6px; border: 1px solid var(--border); background-color: rgba(0, 0, 0, 0.05); padding: 14px; position: relative; display: flex; flex-direction: column;}
        .proj-card.status-qa { border-left: 4px solid var(--warning); }
        .proj-card.status-dev { border-left: 4px solid var(--accent); }

        .proj-meta { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .proj-title-group { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0; padding-right: 15px;}
        .proj-name { font-size: 1rem; font-weight: 600; color: #fff; word-wrap: break-word;}
        .proj-client { font-size: 0.8rem; color: var(--text-muted); }

        .proj-actions { display: flex; gap: 8px; flex-shrink: 0;}
        .tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 2px; text-transform: uppercase; font-weight: 700;}
        .tag-qa { background-color: rgba(250, 176, 5, 0.1); color: var(--warning); }
        .tag-dev { background-color: rgba(34, 139, 230, 0.1); color: var(--accent); }

        .proj-metrics { display: flex; justify-content: space-around; background: rgba(0,0,0,0.1); border-radius: 4px; padding: 8px; margin-top: auto; border-top: 1px solid var(--border); margin-top: 10px;}
        .metric { text-align: center; }
        .metric-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
        .metric-value { font-size: 0.9rem; font-weight: 600; }

        /* Notification Panel */
        #notification_pane { position: fixed; bottom: 20px; right: 20px; max-width: 300px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .notify-toast { background: var(--secondary); color: white; padding: 10px 15px; border-radius: 4px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.2); animation: slideIn 0.3s, fadeOut 0.3s 2.7s; border-left: 4px solid;}
        .notify-toast.error { border-left-color: #fa5252;}
        .notify-toast.success { border-left-color: #12b886;}
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    </style>
</head>
<body>

<header>
    <div class="brand-container">
        <!-- SVG Logo: Flowing sync lines representing Development and QA uniting -->
        <svg class="app-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="gDev" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#339af0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#228be6;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="gQA" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#fab005;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f08c00;stop-opacity:1" />
                </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="45" stroke="none" fill="#2c2e33" />
            <path d="M25 50 Q 50 20 75 50" stroke="url(#gDev)" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M25 50 Q 50 80 75 50" stroke="url(#gQA)" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M75 50 L85 45 L85 55 Z" fill="url(#gQA)" transform="rotate(-15 75 50)"/>
            <path d="M25 50 L15 45 L15 55 Z" fill="url(#gDev)" transform="rotate(-15 25 50)"/>
        </svg>
        <div class="app-title-group">
            <div class="app-name">FreelaSync</div>
            <div class="creator-tag">By Mostafa Sabry</div>
        </div>
    </div>
    <div class="global-actions">
        <button class="btn-header" onclick="App.state.exportData()">Export Database</button>
        <button class="btn-header" onclick="document.getElementById('importFile').click()">Import</button>
        <button class="btn-danger" onclick="App.state.resetDatabase()">Reset All</button>
        <input type="file" id="importFile" style="display:none" onchange="App.state.importData(event)">
    </div>
</header>

<main>
    <!-- LEFT PANEL: Data Input -->
    <div class="form-section">
        <!-- Project Creation -->
        <div class="panel" id="project_creation_panel">
            <div class="panel-header">Create New Project</div>
            <form id="projectForm" onsubmit="App.handlers.createProject(event)">
                <div class="form-group">
                    <label for="pName">Project Name</label>
                    <input type="text" id="pName" placeholder="e.g. Acme API Integration" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="pClient">Client Name</label>
                    <input type="text" id="pClient" placeholder="e.g. Apex Corp" required maxlength="100">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pType">Type</label>
                        <select id="pType" required>
                            <option value="dev">Development</option>
                            <option value="qa">Testing / QA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pRate">Hourly Rate ($)</label>
                        <input type="number" id="pRate" min="0" step="1" value="30" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Register Project</button>
            </form>
        </div>

        <!-- Time Logging -->
        <div class="panel" id="time_logging_panel">
            <div class="panel-header">Log Time Frame</div>
            <form id="logForm" onsubmit="App.handlers.logTime(event)">
                <div class="form-group">
                    <label for="lProjectSelect">Select Project</label>
                    <select id="lProjectSelect" required></select>
                </div>
                <div class="form-group">
                    <label for="lTask">Task / Milestone Description</label>
                    <textarea id="lTask" placeholder="Refined OAuth flow or Executed regression test pack" required rows="2" maxlength="255"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="lStart">Start Time</label>
                        <input type="datetime-local" id="lStart" required>
                    </div>
                    <div class="form-group">
                        <label for="lEnd">End Time</label>
                        <input type="datetime-local" id="lEnd" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Commit Log Entry</button>
            </form>
        </div>
    </div>

    <!-- RIGHT PANEL: Dashboard -->
    <div class="dashboard-section">
        <div class="summary-stats" id="dashboard_summary">
            <!-- Dynamic Injection -->
        </div>

        <div class="panel">
            <div class="panel-header">My Projects Portfolio</div>
            <div id="project_list" class="project-list">
                <!-- Dynamic Injection -->
            </div>
        </div>
    </div>
</main>

<div id="notification_pane"></div>

<script>
/**
 * Production-grade Engineering Principles Applied:
 * 1. Single File Structure
 * 2. Vanilla JS (ES6+) - No External Dependencies
 * 3. Unified Namespace (App)
 * 4. Strictly Data-Driven
 * 5. Complete Error Handling
 */

"use strict";

const App = (() => {

    const DB_KEY = "freelasync_msry_db_v1";

    // CORE DATABASE STRUCTURE (Always complete, never partial)
    let _db = {
        config: {
            creator: "Mostafa Sabry",
            app: "FreelaSync",
            exportTime: null
        },
        metadata: {
            createdCount: 0,
            logCount: 0
        },
        projects: [] // Shape: { id, name, client, type, rate, totalHours, totalEarnings, logs: [{id, task, start, end, hours, earnings}] }
    };

    // --- UTILITIES & UI ---
    const ui = {
        dom: {
            projectForm: document.getElementById('projectForm'),
            logForm: document.getElementById('logForm'),
            projectSelect: document.getElementById('lProjectSelect'),
            summary: document.getElementById('dashboard_summary'),
            projectList: document.getElementById('project_list'),
            notifyPane: document.getElementById('notification_pane'),
            btnLogCommit: document.querySelector('#logForm button[type=submit]')
        },

        showNotify: (message, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = `notify-toast ${type}`;
            toast.innerText = message;
            ui.dom.notifyPane.appendChild(toast);
            setTimeout(() => toast.remove(), 3000); // 3s including fadeout animation
        },

        calcHours: (start, end) => {
            const ms = new Date(end) - new Date(start);
            return parseFloat((ms / (1000 * 60 * 60)).toFixed(2)); // Round to 2 decimal places
        },

        formatMoney: (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        },

        // Data Validation Logic
        validateLog: (start, end) => {
            const startTime = new Date(start);
            const endTime = new Date(end);
            const now = new Date();

            if (isNaN(startTime.getTime()) || isNaN(endTime.getTime())) { return {ok: false, msg: "Invalid dates provided."}; }
            if (endTime <= startTime) { return {ok: false, msg: "End time must be after start time."}; }
            if (endTime > now) { return {ok: false, msg: "Logs cannot be committed for the future."}; }
            return {ok: true};
        }
    };

    // --- STATE MANAGEMENT ---
    const state = {
        load: () => {
            const raw = localStorage.getItem(DB_KEY);
            if (!raw) {
                console.log("FreelaSync: No database found. Initializing new storage.");
                return;
            }
            try {
                _db = JSON.parse(raw);
                state.syncLogSelect(); // Handle potential discrepancies after import
                state.refreshDashboard();
                ui.showNotify("Database loaded and synchronized.", 'success');
            } catch (e) {
                console.error("Critical database corruption detected.", e);
                ui.showNotify("Critical failure: unable to load database.", 'error');
            }
        },

        save: () => {
            localStorage.setItem(DB_KEY, JSON.stringify(_db));
            state.refreshDashboard();
        },

        resetDatabase: () => {
            if (!confirm("CRITICAL WARNING: This will immediately delete all project portfolios and time logs permanently. This action cannot be undone. Are you absolutely certain?")) return;
            localStorage.removeItem(DB_KEY);
            location.reload(); // Hard reset application state
        },

        addProject: (pData) => {
            const pid = `P-${String(++_db.metadata.createdCount).padStart(4, '0')}`;
            _db.projects.push({
                ...pData,
                id: pid,
                totalHours: 0,
                totalEarnings: 0,
                logs: []
            });
            state.syncLogSelect(pid); // Auto-select new project
            state.save();
            ui.showNotify(`Project [${pData.name}] initialized with ID: ${pid}`);
        },

        deleteProject: (pid) => {
            if (!confirm(`Confirm removal of project [${pid}] and all associated logs? This is irreversible.`)) return;
            _db.projects = _db.projects.filter(p => p.id !== pid);
            state.syncLogSelect(); // Ensure select is current
            state.save();
            ui.showNotify(`Project [${pid}] purged from database.`);
        },

        addLogEntry: (pid, logData) => {
            const project = _db.projects.find(p => p.id === pid);
            if (!project) {
                ui.showNotify("Critical error: targeting nonexistent project.", 'error');
                return;
            }

            const hours = ui.calcHours(logData.start, logData.end);
            const earnings = hours * project.rate;

            const lid = `L-${String(++_db.metadata.logCount).padStart(6, '0')}`;
            
            project.logs.push({
                ...logData,
                id: lid,
                hours: hours,
                earnings: earnings
            });

            // Update main project aggregates for faster display/reporting
            project.totalHours = parseFloat((project.totalHours + hours).toFixed(2));
            project.totalEarnings += earnings;

            state.save();
            ui.showNotify(`Committed [${lid}]: ${hours} hours to [${project.name}].`);
        },

        // Synchronization for the dropdown
        syncLogSelect: (selectedPid = null) => {
            if (_db.projects.length === 0) {
                ui.dom.projectSelect.innerHTML = '<option value="">(No Projects Registered)</option>';
                ui.dom.projectSelect.disabled = true;
                ui.dom.btnLogCommit.disabled = true;
                return;
            }

            ui.dom.projectSelect.disabled = false;
            ui.dom.btnLogCommit.disabled = false;
            ui.dom.projectSelect.innerHTML = _db.projects.map(p => 
                `<option value="${p.id}" ${p.id === selectedPid ? 'selected' : ''}>[${p.id}] ${p.name}</option>`
            ).join('');
        },

        refreshDashboard: () => {
            state.renderSummary();
            state.renderProjects();
        },

        renderSummary: () => {
            const totalHours = _db.projects.reduce((sum, p) => sum + p.totalHours, 0).toFixed(2);
            const totalEarnings = _db.projects.reduce((sum, p) => sum + p.totalEarnings, 0);

            ui.dom.summary.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Registered Projects</div>
                    <div class="stat-value">${_db.projects.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Time Commited</div>
                    <div class="stat-value">${totalHours} Hrs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Estimated Gross Revenue</div>
                    <div class="stat-value currency">${ui.formatMoney(totalEarnings)}</div>
                </div>
                 <div class="stat-card">
                    <div class="stat-label">Total Tasks Logged</div>
                    <div class="stat-value">${_db.projects.reduce((sum, p) => sum + p.logs.length, 0)}</div>
                </div>
            `;
        },

        renderProjects: () => {
            if (_db.projects.length === 0) {
                ui.dom.projectList.innerHTML = `<div class="empty-state">No active projects in portfolio. Register a project on the left to begin monitoring.</div>`;
                return;
            }

            ui.dom.projectList.innerHTML = _db.projects.map(p => {
                const typeName = p.type === 'dev' ? 'Development' : 'QA / Testing';
                const tagClass = p.type === 'qa' ? 'tag-qa' : 'tag-dev';
                const statusClass = p.type === 'qa' ? 'status-qa' : 'status-dev';

                return `
                    <div class="proj-card ${statusClass}">
                        <div class="proj-meta">
                            <div class="proj-title-group">
                                <span class="proj-name">${p.name}</span>
                                <span class="proj-client">${p.client}</span>
                            </div>
                            <div class="proj-actions">
                                <span class="tag ${tagClass}">${typeName}</span>
                                <button class="btn-primary" title="Export progress report for [${p.name}]" onclick="App.reports.generateHtmlReport('${p.id}')">Report</button>
                                <button class="btn-danger" onclick="App.state.deleteProject('${p.id}')">x</button>
                            </div>
                        </div>
                        <div class="proj-metrics">
                            <div class="metric">
                                <div class="metric-value">${p.rate}/hr</div>
                                <div class="metric-label">Rate ($)</div>
                            </div>
                             <div class="metric">
                                <div class="metric-value">${p.logs.length}</div>
                                <div class="metric-label">Task Logs</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${p.totalHours.toFixed(2)} Hrs</div>
                                <div class="metric-label">Total Time</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value" style="color: var(--success);">${ui.formatMoney(p.totalEarnings)}</div>
                                <div class="metric-label">Revenue</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        },

        // Native JS Import/Export (Single File portability)
        exportData: () => {
            _db.config.exportTime = new Date().toISOString();
            const dataStr = JSON.stringify(_db, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileName = `freelasync_backup_${_db.config.exportTime.split('T')[0]}.json`;

            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileName);
            linkElement.click();
            linkElement.remove();
            ui.showNotify("JSON backup generated.");
        },

        importData: (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    // Validation: check basic shape
                    if (!imported.config || !imported.config.creator === "Mostafa Sabry" || !imported.projects) {
                        throw new Error("Invalid or incompatible database schema.");
                    }
                    _db = imported;
                    state.syncLogSelect();
                    state.save();
                    ui.showNotify("Database synchronization successful.", 'success');
                } catch (err) {
                    console.error(err);
                    ui.showNotify("CRITICAL: Incompatible database file.", 'error');
                }
            };
            reader.readAsText(file);
        }
    };

    // --- FORM EVENT HANDLERS ---
    const handlers = {
        createProject: (e) => {
            e.preventDefault();
            const pName = document.getElementById('pName').value.trim();
            const pClient = document.getElementById('pClient').value.trim();
            const pType = document.getElementById('pType').value;
            const pRate = parseInt(document.getElementById('pRate').value, 10);

            if (!pName || !pClient || isNaN(pRate) || pRate < 0) {
                ui.showNotify("Data integrity failure: missing required project fields.", 'error');
                return;
            }

            state.addProject({
                name: pName,
                client: pClient,
                type: pType,
                rate: pRate
            });

            ui.dom.projectForm.reset();
        },

        logTime: (e) => {
            e.preventDefault();
            const pid = ui.dom.projectSelect.value;
            const task = document.getElementById('lTask').value.trim();
            const startStr = document.getElementById('lStart').value;
            const endStr = document.getElementById('lEnd').value;

            if (!pid) { ui.showNotify("No project selected.", 'error'); return; }
            if (!task) { ui.showNotify("Task description required.", 'error'); return; }

            const check = ui.validateLog(startStr, endStr);
            if (!check.ok) {
                ui.showNotify(`Validation Error: ${check.msg}`, 'error');
                return;
            }

            state.addLogEntry(pid, {
                task: task,
                start: startStr,
                end: endStr
            });

            ui.dom.logForm.reset();
            state.syncLogSelect(pid); // Maintain current project selection
        }
    };

    // --- HTML REPORT GENERATION ---
    const reports = {
        // Core Principle: Zero dependencies, creates an standalone document
        generateHtmlReport: (pid) => {
            const project = _db.projects.find(p => p.id === pid);
            if (!project) return;

            const totalHours = project.totalHours.toFixed(2);
            const totalRevenue = ui.formatMoney(project.totalEarnings);
            const typeName = project.type === 'dev' ? 'Development' : 'QA / Testing';
            const timestamp = new Date().toLocaleString('en-US', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'});

            // Constructing report document stream
            let htmlStream = `
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Report: ${project.name} | FreelaSync - Mostafa Sabry</title>
<style>
    body { font-family: -apple-system, system-ui, Arial, sans-serif; padding: 30px; color: #1a1b1e; background: #fff; font-size: 14px;}
    header { display: flex; justify-content: space-between; align-items: start; border-bottom: 2px solid #339af0; padding-bottom: 15px; margin-bottom: 30px; }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 700; color: #1a1b1e;}
    .client { font-size: 0.95rem; color: #666;}
    .gen-info { text-align: right; font-size: 0.85rem; color: #777;}
    
    .meta-blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .block { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 4px; padding: 15px; text-align: center;}
    .bl-label { font-size: 0.75rem; text-transform: uppercase; color: #777; margin-bottom: 4px;}
    .bl-val { font-size: 1.3rem; font-weight: 700; color: #1a1b1e;}
    .bl-val.revenue { color: #12b886;}

    h2 { font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 15px;}
    table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; border: 1px solid #e9ecef;}
    th { background-color: #f8f9fa; color: #555; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px; padding: 10px; text-align: left; border-bottom: 1px solid #e9ecef; }
    td { padding: 10px; border-bottom: 1px solid #e9ecef; vertical-align: top; word-wrap: break-word;}
    tr:nth-child(even) { background-color: #fcfcfc;}

    .creator-footer { margin-top: 40px; padding-top: 15px; border-top: 1px solid #eee; text-align: center; color: #777; font-size: 0.85rem;}
</style>
</head>
<body>
    <header>
        <div>
            <h1>Project Work Report</h1>
            <div class="client">Report For: <strong>${project.name}</strong> (${typeName})</div>
            <div class="client">Client: ${project.client}</div>
        </div>
        <div class="gen-info">
            Generated via FreelaSync<br>
            Date: ${timestamp}
        </div>
    </header>

    <div class="meta-blocks">
        <div class="block"><div class="bl-label">Hourly Rate</div><div class="bl-val">$${project.rate}/hr</div></div>
        <div class="block"><div class="bl-label">Total Time Invested</div><div class="bl-val">${totalHours} Hrs</div></div>
        <div class="block"><div class="bl-label">Amount Accrued</div><div class="bl-val revenue">${totalRevenue}</div></div>
    </div>

    <h2>Activity Logs & Milestone Details</h2>
    ${ project.logs.length === 0 ? '<p style="color: #666; font-style: italic;">No work logged for this project frame yet.</p>' :
    `<table>
        <thead>
            <tr>
                <th style="width: 40%;">Task / Activity</th>
                <th style="width: 25%;">Time Frame</th>
                <th style="width: 15%;">Hours</th>
                <th style="width: 20%;">Accrued ($)</th>
            </tr>
        </thead>
        <tbody>` +
            project.logs.map(l => `
                <tr>
                    <td>${l.task}</td>
                    <td>${new Date(l.start).toLocaleDateString()} ${new Date(l.start).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}<br>
                        ${new Date(l.end).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                    </td>
                    <td>${l.hours} Hrs</td>
                    <td>${ui.formatMoney(l.earnings)}</td>
                </tr>
            `).join('')
        + `</tbody></table>`}

    <div class="creator-footer">
        Freelancer Management Portal by <strong>Mostafa Sabry</strong>
    </div>
</body>
</html>`;

            // Deliver standalone HTML file via Blob
            try {
                const blob = new Blob([htmlStream], { type: "text/html;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `freelasync_report_${project.id}_${project.name.replace(/\s+/g, '_')}.html`);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
                ui.showNotify(`HTML Report generated for [${project.name}].`, 'success');
            } catch (err) {
                console.error("Report Generation Critical Failure", err);
                ui.showNotify("CRITICAL: Failed to generate report stream.", "error");
            }
        }
    };

    // Public API
    return {
        init: state.load,
        state: state,
        handlers: handlers,
        reports: reports
    };

})();

// Initialize Production Environment
window.addEventListener('DOMContentLoaded', App.init);

</script>
</body>
</html>
