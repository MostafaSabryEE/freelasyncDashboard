<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelaSync | Freelancer Management System - Mostafa Sabry</title>
    <style>
        :root {
            --primary: #1a1b1e;
            --secondary: #2c2e33;
            --accent: #0077b6;
            --accent-hover: #023e8a;
            --text-main: #c1c2c5;
            --text-muted: #909296;
            --border: #373a40;
            --success: #00b4d8;
            --warning: #fab005;
            --logo-blue: #0b4f8a;
            --logo-teal: #00a88f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--primary); color: var(--text-main); font-size: 14px; display: flex; flex-direction: column; min-height: 100vh; padding: 20px; }

        button { cursor: pointer; border: none; border-radius: 4px; padding: 6px 12px; font-weight: 500; transition: background 0.2s, color 0.2s; }
        button:hover { opacity: 0.9; }

        /* HEADER & LOGO INTEGRATION */
        header { display: flex; align-items: center; justify-content: space-between; padding: 0 0 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; gap: 20px;}

        .brand-container { display: flex; align-items: center; gap: 16px; min-width: 0;}
        .brand-logo-svg { width: 52px; height: 52px; flex-shrink: 0; }
        .app-title-group { display: flex; flex-direction: column;}
        .app-name { font-size: 1.3rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1.5px; }
        .creator-tag { font-size: 0.75rem; color: var(--logo-teal); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-top: -2px; }

        .global-actions { display: flex; gap: 10px; flex-shrink: 0;}
        .btn-header { background: var(--secondary); color: var(--text-main); border: 1px solid var(--border); }
        .btn-header:hover { background: var(--accent); color: white; border-color: transparent;}
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-danger { background: rgba(250, 82, 82, 0.1); color: #fa5252; border: 1px solid rgba(250, 82, 82, 0.2);}
        .btn-danger:hover { background: #fa5252; color: white; }

        /* LAYOUT & GENERAL UI */
        main { flex-grow: 1; display: grid; grid-template-columns: minmax(320px, 1fr) 3fr; gap: 20px; }
        @media (max-width: 992px) { main { grid-template-columns: 1fr; } }

        .form-section, .dashboard-section { display: flex; flex-direction: column; gap: 20px; }

        .panel { background-color: var(--secondary); border: 1px solid var(--border); border-radius: 6px; padding: 16px; display: flex; flex-direction: column;}
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-size: 0.95rem; font-weight: 600; color: #fff; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;}
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;}
        label { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { background-color: rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.05); color: #f8f9fa; border-radius: 4px; padding: 8px 10px; font-size: 0.9rem;}
        input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: transparent;}

        /* DASHBOARD SUMMARY */
        .summary-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;}
        @media (max-width: 600px) { .summary-stats { grid-template-columns: 1fr 1fr;} }
        .stat-card { background: rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 4px;}
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .stat-value.currency { color: var(--success); }

        /* PROJECT LIST & CARDS */
        .project-list { display: flex; flex-direction: column; gap: 16px; margin-top: 10px;}
        .empty-state { text-align: center; color: var(--text-muted); padding: 30px 0; border: 2px dashed var(--border); border-radius: 6px;}

        .proj-card { border-radius: 6px; border: 1px solid var(--border); background-color: rgba(0, 0, 0, 0.05); padding: 14px; position: relative; display: flex; flex-direction: column;}
        .proj-card.status-qa { border-left: 4px solid var(--logo-teal); }
        .proj-card.status-dev { border-left: 4px solid var(--logo-blue); }

        .proj-meta { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .proj-title-group { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0; padding-right: 15px;}
        .proj-name { font-size: 1rem; font-weight: 600; color: #fff; word-wrap: break-word;}
        .proj-client { font-size: 0.8rem; color: var(--text-muted); }

        .proj-actions { display: flex; gap: 8px; flex-shrink: 0;}
        .tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 2px; text-transform: uppercase; font-weight: 700;}
        .tag-qa { background-color: rgba(0, 168, 143, 0.15); color: var(--logo-teal); }
        .tag-dev { background-color: rgba(11, 79, 138, 0.25); color: #4ea8de; }

        .proj-metrics { display: flex; justify-content: space-around; background: rgba(0,0,0,0.1); border-radius: 4px; padding: 8px; margin-top: 10px; border-top: 1px solid var(--border);}
        .metric { text-align: center; }
        .metric-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
        .metric-value { font-size: 0.9rem; font-weight: 600; }

        #notification_pane { position: fixed; bottom: 20px; right: 20px; max-width: 300px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .notify-toast { background: var(--secondary); color: white; padding: 10px 15px; border-radius: 4px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.2); animation: slideIn 0.3s, fadeOut 0.3s 2.7s; border-left: 4px solid;}
        .notify-toast.error { border-left-color: #fa5252;}
        .notify-toast.success { border-left-color: var(--logo-teal);}
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>

<header>
    <div class="brand-container">
        <svg class="brand-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 25 160 L 25 40 L 75 90 L 75 160 H 50 V 85 L 38 70 V 160 Z" fill="#0B4F8A"/>
            <path d="M 125 40 H 175 V 65 L 140 100 V 125 H 175 V 160 H 115 V 130 L 150 95 V 65 H 125 Z" fill="#0B4F8A"/>
            <path d="M 45 130 L 80 85 L 135 40 L 120 40 L 75 80 L 55 105 Z" fill="#00A88F"/>
            <path d="M 80 85 L 105 150 L 115 130 L 95 80 Z" fill="#00A88F"/>
            <circle cx="155" cy="75" r="3" fill="#00A88F"/><path d="M 145 75 H 155 V 85" stroke="#00A88F" stroke-width="2"/>
            <circle cx="165" cy="115" r="3" fill="#00A88F"/><path d="M 155 115 H 165 V 105" stroke="#00A88F" stroke-width="2"/>
            <circle cx="130" cy="140" r="3" fill="#00A88F"/><path d="M 130 140 V 150 H 140" stroke="#00A88F" stroke-width="2"/>
        </svg>
        <div class="app-title-group">
            <div class="app-name">FreelaSync</div>
            <div class="creator-tag">Mostafa Sabry • Dev & QA</div>
        </div>
    </div>
    <div class="global-actions">
        <button class="btn-header" onclick="App.state.exportData()">Export Database</button>
        <button class="btn-header" onclick="document.getElementById('importFile').click()">Import</button>
        <button class="btn-danger" onclick="App.state.resetDatabase()">Reset All</button>
        <input type="file" id="importFile" style="display:none" onchange="App.state.importData(event)">
    </div>
</header>

<main>
    <div class="form-section">
        <div class="panel" id="project_creation_panel">
            <div class="panel-header">Create New Project</div>
            <form id="projectForm" onsubmit="App.handlers.createProject(event)">
                <div class="form-group">
                    <label for="pName">Project Name</label>
                    <input type="text" id="pName" placeholder="e.g. E-Commerce Automated Testing" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="pClient">Client Name</label>
                    <input type="text" id="pClient" placeholder="e.g. Global Tech Solutions" required maxlength="100">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pType">Type</label>
                        <select id="pType" required>
                            <option value="dev">Development</option>
                            <option value="qa">Software Testing / QA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="pRate">Hourly Rate ($)</label>
                        <input type="number" id="pRate" min="0" step="1" value="40" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Register Project</button>
            </form>
        </div>

        <div class="panel" id="time_logging_panel">
            <div class="panel-header">Log Time Frame</div>
            <form id="logForm" onsubmit="App.handlers.logTime(event)">
                <div class="form-group">
                    <label for="lProjectSelect">Select Project</label>
                    <select id="lProjectSelect" required></select>
                </div>
                <div class="form-group">
                    <label for="lTask">Task / Milestone Description</label>
                    <textarea id="lTask" placeholder="Executed Cypress regression suite or Built auth middleware" required rows="2" maxlength="255"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="lStart">Start Time</label>
                        <input type="datetime-local" id="lStart" required>
                    </div>
                    <div class="form-group">
                        <label for="lEnd">End Time</label>
                        <input type="datetime-local" id="lEnd" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Commit Log Entry</button>
            </form>
        </div>
    </div>

    <div class="dashboard-section">
        <div class="summary-stats" id="dashboard_summary"></div>

        <div class="panel">
            <div class="panel-header">My Projects Portfolio</div>
            <div id="project_list" class="project-list"></div>
        </div>
    </div>
</main>

<div id="notification_pane"></div>

<script>
"use strict";

const App = (() => {

    const DB_KEY = "freelasync_msry_db_v2";

    let _db = {
        config: {
            creator: "Mostafa Sabry",
            app: "FreelaSync",
            exportTime: null
        },
        metadata: {
            createdCount: 0,
            logCount: 0
        },
        projects: []
    };

    const ui = {
        dom: {
            projectForm: document.getElementById('projectForm'),
            logForm: document.getElementById('logForm'),
            projectSelect: document.getElementById('lProjectSelect'),
            summary: document.getElementById('dashboard_summary'),
            projectList: document.getElementById('project_list'),
            notifyPane: document.getElementById('notification_pane'),
            btnLogCommit: document.querySelector('#logForm button[type=submit]')
        },

        showNotify: (message, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = `notify-toast ${type}`;
            toast.innerText = message;
            ui.dom.notifyPane.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        },

        calcHours: (start, end) => {
            const ms = new Date(end) - new Date(start);
            return parseFloat((ms / (1000 * 60 * 60)).toFixed(2));
        },

        formatMoney: (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        },

        validateLog: (start, end) => {
            const startTime = new Date(start);
            const endTime = new Date(end);
            const now = new Date();

            if (isNaN(startTime.getTime()) || isNaN(endTime.getTime())) { return {ok: false, msg: "Invalid dates provided."}; }
            if (endTime <= startTime) { return {ok: false, msg: "End time must be after start time."}; }
            if (endTime > now) { return {ok: false, msg: "Logs cannot be committed for the future."}; }
            return {ok: true};
        }
    };

    const state = {
        load: () => {
            const raw = localStorage.getItem(DB_KEY);
            if (!raw) return;
            try {
                _db = JSON.parse(raw);
                state.syncLogSelect();
                state.refreshDashboard();
                ui.showNotify("Database loaded.", 'success');
            } catch (e) {
                ui.showNotify("Error loading stored data.", 'error');
            }
        },

        save: () => {
            localStorage.setItem(DB_KEY, JSON.stringify(_db));
            state.refreshDashboard();
        },

        resetDatabase: () => {
            if (!confirm("Delete all projects and logs permanently?")) return;
            localStorage.removeItem(DB_KEY);
            location.reload();
        },

        addProject: (pData) => {
            const pid = `P-${String(++_db.metadata.createdCount).padStart(4, '0')}`;
            _db.projects.push({
                ...pData,
                id: pid,
                totalHours: 0,
                totalEarnings: 0,
                logs: []
            });
            state.syncLogSelect(pid);
            state.save();
            ui.showNotify(`Project [${pData.name}] initialized.`);
        },

        deleteProject: (pid) => {
            if (!confirm(`Remove project [${pid}] and all associated logs?`)) return;
            _db.projects = _db.projects.filter(p => p.id !== pid);
            state.syncLogSelect();
            state.save();
            ui.showNotify(`Project deleted.`);
        },

        addLogEntry: (pid, logData) => {
            const project = _db.projects.find(p => p.id === pid);
            if (!project) return;

            const hours = ui.calcHours(logData.start, logData.end);
            const earnings = hours * project.rate;

            const lid = `L-${String(++_db.metadata.logCount).padStart(6, '0')}`;
            
            project.logs.push({
                ...logData,
                id: lid,
                hours: hours,
                earnings: earnings
            });

            project.totalHours = parseFloat((project.totalHours + hours).toFixed(2));
            project.totalEarnings += earnings;

            state.save();
            ui.showNotify(`Logged ${hours} hrs to [${project.name}].`);
        },

        syncLogSelect: (selectedPid = null) => {
            if (_db.projects.length === 0) {
                ui.dom.projectSelect.innerHTML = '<option value="">(No Projects Registered)</option>';
                ui.dom.projectSelect.disabled = true;
                ui.dom.btnLogCommit.disabled = true;
                return;
            }

            ui.dom.projectSelect.disabled = false;
            ui.dom.btnLogCommit.disabled = false;
            ui.dom.projectSelect.innerHTML = _db.projects.map(p => 
                `<option value="${p.id}" ${p.id === selectedPid ? 'selected' : ''}>[${p.id}] ${p.name}</option>`
            ).join('');
        },

        refreshDashboard: () => {
            state.renderSummary();
            state.renderProjects();
        },

        renderSummary: () => {
            const totalHours = _db.projects.reduce((sum, p) => sum + p.totalHours, 0).toFixed(2);
            const totalEarnings = _db.projects.reduce((sum, p) => sum + p.totalEarnings, 0);

            ui.dom.summary.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Registered Projects</div>
                    <div class="stat-value">${_db.projects.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Time Commited</div>
                    <div class="stat-value">${totalHours} Hrs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Estimated Gross Revenue</div>
                    <div class="stat-value currency">${ui.formatMoney(totalEarnings)}</div>
                </div>
                 <div class="stat-card">
                    <div class="stat-label">Total Tasks Logged</div>
                    <div class="stat-value">${_db.projects.reduce((sum, p) => sum + p.logs.length, 0)}</div>
                </div>
            `;
        },

        renderProjects: () => {
            if (_db.projects.length === 0) {
                ui.dom.projectList.innerHTML = `<div class="empty-state">No active projects in portfolio. Register a project on the left to begin tracking.</div>`;
                return;
            }

            ui.dom.projectList.innerHTML = _db.projects.map(p => {
                const typeName = p.type === 'dev' ? 'Development' : 'QA / Testing';
                const tagClass = p.type === 'qa' ? 'tag-qa' : 'tag-dev';
                const statusClass = p.type === 'qa' ? 'status-qa' : 'status-dev';

                return `
                    <div class="proj-card ${statusClass}">
                        <div class="proj-meta">
                            <div class="proj-title-group">
                                <span class="proj-name">${p.name}</span>
                                <span class="proj-client">${p.client}</span>
                            </div>
                            <div class="proj-actions">
                                <span class="tag ${tagClass}">${typeName}</span>
                                <button class="btn-primary" onclick="App.reports.generateHtmlReport('${p.id}')">Report</button>
                                <button class="btn-danger" onclick="App.state.deleteProject('${p.id}')">x</button>
                            </div>
                        </div>
                        <div class="proj-metrics">
                            <div class="metric">
                                <div class="metric-value">$${p.rate}/hr</div>
                                <div class="metric-label">Rate</div>
                            </div>
                             <div class="metric">
                                <div class="metric-value">${p.logs.length}</div>
                                <div class="metric-label">Logs</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${p.totalHours.toFixed(2)} Hrs</div>
                                <div class="metric-label">Time</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value" style="color: var(--success);">${ui.formatMoney(p.totalEarnings)}</div>
                                <div class="metric-label">Revenue</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        },

        exportData: () => {
            _db.config.exportTime = new Date().toISOString();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(_db, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", `freelasync_backup_${_db.config.exportTime.split('T')[0]}.json`);
            a.click();
            ui.showNotify("Backup exported.");
        },

        importData: (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.projects) throw new Error("Invalid structure");
                    _db = imported;
                    state.syncLogSelect();
                    state.save();
                    ui.showNotify("Database restored successfully.", 'success');
                } catch (err) {
                    ui.showNotify("Invalid database file format.", 'error');
                }
            };
            reader.readAsText(file);
        }
    };

    const handlers = {
        createProject: (e) => {
            e.preventDefault();
            const pName = document.getElementById('pName').value.trim();
            const pClient = document.getElementById('pClient').value.trim();
            const pType = document.getElementById('pType').value;
            const pRate = parseInt(document.getElementById('pRate').value, 10);

            if (!pName || !pClient || isNaN(pRate) || pRate < 0) return;

            state.addProject({ name: pName, client: pClient, type: pType, rate: pRate });
            ui.dom.projectForm.reset();
        },

        logTime: (e) => {
            e.preventDefault();
            const pid = ui.dom.projectSelect.value;
            const task = document.getElementById('lTask').value.trim();
            const startStr = document.getElementById('lStart').value;
            const endStr = document.getElementById('lEnd').value;

            const check = ui.validateLog(startStr, endStr);
            if (!check.ok) {
                ui.showNotify(check.msg, 'error');
                return;
            }

            state.addLogEntry(pid, { task: task, start: startStr, end: endStr });
            ui.dom.logForm.reset();
            state.syncLogSelect(pid);
        }
    };

    const reports = {
        generateHtmlReport: (pid) => {
            const project = _db.projects.find(p => p.id === pid);
            if (!project) return;

            const totalHours = project.totalHours.toFixed(2);
            const totalRevenue = ui.formatMoney(project.totalEarnings);
            const typeName = project.type === 'dev' ? 'Development' : 'QA / Software Testing';
            const timestamp = new Date().toLocaleString('en-US');

            let htmlStream = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work Report: ${project.name} - Mostafa Sabry</title>
<style>
    body { font-family: -apple-system, system-ui, Arial, sans-serif; padding: 40px; color: #1a1b1e; background: #fff; font-size: 14px;}
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0B4F8A; padding-bottom: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 15px; }
    .logo { width: 45px; height: 45px; }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: #0B4F8A;}
    .client { font-size: 0.9rem; color: #666;}
    
    .meta-blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .block { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 4px; padding: 15px; text-align: center;}
    .bl-label { font-size: 0.75rem; text-transform: uppercase; color: #777; margin-bottom: 4px;}
    .bl-val { font-size: 1.3rem; font-weight: 700; color: #1a1b1e;}
    .bl-val.revenue { color: #00A88F;}

    table { width: 100%; border-collapse: collapse; margin-top: 10px; border: 1px solid #e9ecef;}
    th { background-color: #f8f9fa; color: #555; text-transform: uppercase; font-size: 0.7rem; padding: 10px; text-align: left; border-bottom: 1px solid #e9ecef; }
    td { padding: 10px; border-bottom: 1px solid #e9ecef; }
    .footer { margin-top: 40px; padding-top: 15px; border-top: 1px solid #eee; text-align: center; color: #777; font-size: 0.85rem;}
</style>
</head>
<body>
    <header>
        <div class="brand">
            <svg class="logo" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 25 160 L 25 40 L 75 90 L 75 160 H 50 V 85 L 38 70 V 160 Z" fill="#0B4F8A"/>
                <path d="M 125 40 H 175 V 65 L 140 100 V 125 H 175 V 160 H 115 V 130 L 150 95 V 65 H 125 Z" fill="#0B4F8A"/>
                <path d="M 45 130 L 80 85 L 135 40 L 120 40 L 75 80 L 55 105 Z" fill="#00A88F"/>
                <path d="M 80 85 L 105 150 L 115 130 L 95 80 Z" fill="#00A88F"/>
            </svg>
            <div>
                <h1>Project Execution Report</h1>
                <div class="client"><strong>${project.name}</strong> (${typeName}) | Client: ${project.client}</div>
            </div>
        </div>
        <div style="text-align: right; font-size: 0.8rem; color: #777;">Generated: ${timestamp}</div>
    </header>

    <div class="meta-blocks">
        <div class="block"><div class="bl-label">Hourly Rate</div><div class="bl-val">$${project.rate}/hr</div></div>
        <div class="block"><div class="bl-label">Total Hours Logged</div><div class="bl-val">${totalHours} Hrs</div></div>
        <div class="block"><div class="bl-label">Total Accrued</div><div class="bl-val revenue">${totalRevenue}</div></div>
    </div>

    <h2>Detailed Milestone & Task Logs</h2>
    <table>
        <thead>
            <tr>
                <th>Task / Milestone Description</th>
                <th>Time Window</th>
                <th>Duration</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            ${project.logs.map(l => `
                <tr>
                    <td>${l.task}</td>

</body>
</html>`;

            const blob = new Blob([htmlStream], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Report_${project.name.replace(/\s+/g, '_')}.html`);
            link.click();
            URL.revokeObjectURL(url);
            ui.showNotify(`Report generated for [${project.name}].`);
        }
    };

    return { init: state.load, state, handlers, reports };
})();

window.addEventListener('DOMContentLoaded', App.init);
